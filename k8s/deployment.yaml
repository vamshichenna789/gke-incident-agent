apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-agent
  namespace: ai-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: incident-agent
  template:
    metadata:
      labels:
        app: incident-agent
    spec:
      serviceAccountName: incident-agent
      automountServiceAccountToken: true

      # Dedicated node pool created with cloud-platform scope because
      # the original node pool had restrictive immutable OAuth scopes.
      nodeSelector:
        cloud.google.com/gke-nodepool: ai-agent-pool

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: agent
          image: us-central1-docker.pkg.dev/burner-chekrish1-6840/ai-agent/incident-agent:v13
          imagePullPolicy: IfNotPresent

          envFrom:
            - configMapRef:
                name: incident-agent-config

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
