apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-agent
  namespace: ai-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: incident-agent
  template:
    metadata:
      labels:
        app: incident-agent
    spec:
      serviceAccountName: incident-agent
      automountServiceAccountToken: true
      # Optional: pin the agent to a dedicated node pool.
      # nodeSelector:
      #   cloud.google.com/gke-nodepool: <AGENT_NODEPOOL>
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: <ARTIFACT_REGISTRY_IMAGE>
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: incident-agent-config
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
